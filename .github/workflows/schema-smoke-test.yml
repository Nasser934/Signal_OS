name: Schema smoke test

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run schema verification
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signalos
        run: bash scripts/verify_schema.sh
