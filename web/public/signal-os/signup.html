<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sign up - Signal OS</title><link rel="icon" href="favicon.svg" /><link rel="stylesheet" href="css/signal-os.css" /></head>
<body>
  <main class="auth-wrap">
    <section class="auth-card panel">
      <a class="brand" href="index.html"><span class="mark">S</span><span>Signal OS</span></a>
      <h1>Create a trend intelligence workspace.</h1>
      <p class="muted">Start with mock data now, then connect Supabase, source imports, and export workflows when the product moves to build.</p>
      <form class="form" data-auth-form>
        <label>Work email<input type="email" placeholder="founder@company.com" /></label>
        <label>Workspace name<input type="text" placeholder="Apex Growth Lab" /></label>
        <label>Password<input type="password" placeholder="12+ characters" /></label>
        <p class="error-msg">A valid work email is required.</p>
        <button class="btn btn-primary" type="submit">Create workspace</button>
      </form>
    </section>
  </main>
  <script src="js/signal-os.js"></script>
</body>
</html>
