<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Log in - Signal OS</title><link rel="icon" href="favicon.svg" /><link rel="stylesheet" href="css/signal-os.css" /></head>
<body>
  <main class="auth-wrap">
    <section class="auth-card panel">
      <a class="brand" href="index.html"><span class="mark">S</span><span>Signal OS</span></a>
      <h1>Open your signal workspace.</h1>
      <p class="muted">Use your Supabase Auth account to continue analyzing creator and trend movement.</p>
      <form class="form" data-auth-form>
        <label>Email<input type="email" placeholder="analyst@company.com" /></label>
        <label>Password<input type="password" placeholder="Password" /></label>
        <p class="error-msg">Enter a valid work email before continuing.</p>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p class="muted" style="font-size:13px">Need a workspace? <a href="signup.html" style="color:var(--accent)">Create one</a></p>
    </section>
  </main>
  <script src="js/signal-os.js"></script>
</body>
</html>
